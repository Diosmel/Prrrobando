name: Import Open WebUI Into Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Clone Open WebUI
        run: |
          rm -rf open-webui
          git clone --depth 1 https://github.com/open-webui/open-webui.git open-webui
          rm -rf open-webui/.git

      - name: Commit files
        run: |
          git add open-webui
          git commit -m "Import Open WebUI source into folder" || echo "No changes"
          git push
